<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 466" role="img" aria-label="Job states: a job is created queued with attempt 1; its first claim makes it running. A queued job can be cancelled, or fail when its backend is unavailable and nothing else can take it after the grace. A running job stays running when an attempt fails and the next one is queued, and ends succeeded when an attempt succeeds, failed when the last attempt failed with no next backend, or cancelled." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .zone-default { fill: #eef2f8; stroke: #8aa0c2; } .zone-workers { fill: #eef7f1; stroke: #7fb38f; }
    .zone-converter { fill: #fbf1e6; stroke: #d0a06a; } .zone-store { fill: #f3effb; stroke: #a78fd6; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.bridge, .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.6; }
    .box.obs, .dashed { stroke-dasharray: 4 3; } .box.engine { fill: #f7f7f7; }
    .box.ok { stroke: #1a7f37; stroke-width: 1.6; } .box.bad { stroke: #c62a2f; stroke-width: 1.6; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .arrow.ok { stroke: #1a7f37; } .head-ok { fill: #1a7f37; } .arrow.bad { stroke: #c62a2f; } .head-bad { fill: #c62a2f; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zt { font-size: 12px; font-weight: 700; letter-spacing: .04em; } .name { font-size: 12.5px; font-weight: 600; }
    .note { font-size: 11px; }
    .frame { fill: #eef7f1; stroke: #7fb38f; } .step { fill: #ffffff; stroke: #8b93a3; } .step.filter { fill: #e8e4fb; stroke: #7a4fd6; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .zone-default { fill: #18202d; stroke: #4f6a94; } .zone-workers { fill: #15241b; stroke: #4f8a62; }
      .zone-converter { fill: #2a1f14; stroke: #a3743d; } .zone-store { fill: #211a33; stroke: #7d62b8; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.bridge, .store { fill: #33290f; stroke: #e5b94e; }
      .box.engine { fill: #23262d; } .box.ok { stroke: #5cc97a; } .box.bad { stroke: #ff7b7b; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .arrow.ok { stroke: #5cc97a; } .head-ok { fill: #5cc97a; } .arrow.bad { stroke: #ff7b7b; } .head-bad { fill: #ff7b7b; }
      .frame { fill: #15241b; stroke: #4f8a62; } .step { fill: #1b1e25; stroke: #6b7385; } .step.filter { fill: #261d45; stroke: #b195ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-ok"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-bad"/>
    </marker>
  </defs>
  <circle class="head" cx="410" cy="26" r="8"/>
  <path class="arrow" d="M410 34 L410 80" marker-end="url(#a)"/>
  <text class="note muted" x="418" y="62" text-anchor="start">created with attempt 1</text>
  <rect class="box" x="345" y="80" width="130" height="40" rx="12"/>
  <text class="name fg" x="410.0" y="104" text-anchor="middle">queued</text>
  <path class="arrow" d="M410 120 L410 220" marker-end="url(#a)"/>
  <text class="note muted" x="418" y="174" text-anchor="start">first attempt claimed</text>
  <rect class="box" x="345" y="220" width="130" height="40" rx="12"/>
  <text class="name fg" x="410.0" y="244" text-anchor="middle">running</text>
  <path class="arrow" d="M475 232 C 540 220, 540 262, 477 250" marker-end="url(#a)"/>
  <text class="note muted" x="546" y="238" text-anchor="start">attempt failed,</text>
  <text class="note muted" x="546" y="252" text-anchor="start">next attempt queued</text>
  <path class="arrow" d="M345 100 L120 100 L120 376" marker-end="url(#a)"/>
  <text class="note muted" x="232" y="92" text-anchor="middle">cancel</text>
  <path class="arrow" d="M475 100 L700 100 L700 376" marker-end="url(#a)"/>
  <text class="note muted" x="588" y="78" text-anchor="middle">backend unavailable,</text>
  <text class="note muted" x="588" y="92" text-anchor="middle">no alternative after the grace</text>
  <path class="arrow" d="M410 260 L410 376" marker-end="url(#a)"/>
  <text class="note muted" x="418" y="322" text-anchor="start">attempt succeeded</text>
  <path class="arrow" d="M360 260 L180 376" marker-end="url(#a)"/>
  <text class="note muted" x="258" y="318" text-anchor="end">cancel</text>
  <path class="arrow" d="M460 260 L640 376" marker-end="url(#a)"/>
  <text class="note muted" x="566" y="300" text-anchor="start">last attempt failed,</text>
  <text class="note muted" x="566" y="314" text-anchor="start">no next backend</text>
  <rect class="box " x="56" y="376" width="138" height="48" rx="10"/>
  <rect class="box " x="60" y="380" width="130" height="40" rx="7"/>
  <text class="name fg" x="125.0" y="404" text-anchor="middle">cancelled</text>
  <rect class="box ok" x="341" y="376" width="138" height="48" rx="10"/>
  <rect class="box ok" x="345" y="380" width="130" height="40" rx="7"/>
  <text class="name fg" x="410.0" y="404" text-anchor="middle">succeeded</text>
  <rect class="box bad" x="626" y="376" width="138" height="48" rx="10"/>
  <rect class="box bad" x="630" y="380" width="130" height="40" rx="7"/>
  <text class="name fg" x="695.0" y="404" text-anchor="middle">failed</text>
  <text class="note muted" x="410" y="450" text-anchor="middle">double border: terminal</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
