<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-label="Two requests with the same Idempotency-Key: request 1 reserves the key in Postgres; request 2 finds the same hash, no job and a fresh heartbeat, and gets 409 with Retry-After 2. Request 1 keeps the heartbeat while it uploads, puts the inputs in S3, then creates the job and attaches it to the key in one transaction; request 2's retry gets a replay of the job." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .box { fill: #ffffff; stroke: #1d2330; } .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.4; }
    .frame { fill: #eef7f1; stroke: #7fb38f; } .step { fill: #ffffff; stroke: #8b93a3; } .step.filter { fill: #e8e4fb; stroke: #7a4fd6; }
    .alt { fill: #f6f7f9; stroke: #8b93a3; } .thead { fill: #eef2f8; stroke: #1d2330; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; } .dash { stroke-dasharray: 5 4; }
    .life { stroke: #8b93a3; stroke-dasharray: 4 4; fill: none; } .sep { stroke: #8b93a3; stroke-dasharray: 4 3; fill: none; }
    .bad { stroke: #c62a2f; fill: none; } .head-bad { fill: #c62a2f; } .tbad { fill: #c62a2f; }
    .ok { stroke: #1a7f37; fill: none; } .head-ok { fill: #1a7f37; } .tok { fill: #1a7f37; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name { font-size: 13px; font-weight: 600; } .note { font-size: 11px; } .tag { font-size: 11px; font-weight: 700; }
    .col { font-size: 11.5px; } .key { font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .store { fill: #33290f; stroke: #e5b94e; }
      .frame { fill: #15241b; stroke: #4f8a62; } .step { fill: #1b1e25; stroke: #6b7385; } .step.filter { fill: #261d45; stroke: #b195ff; }
      .alt { fill: #20232b; stroke: #6b7385; } .thead { fill: #18202d; stroke: #c9ced8; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .life { stroke: #6b7385; } .sep { stroke: #6b7385; }
      .bad { stroke: #ff7b7b; } .head-bad { fill: #ff7b7b; } .tbad { fill: #ff7b7b; }
      .ok { stroke: #5cc97a; } .head-ok { fill: #5cc97a; } .tok { fill: #5cc97a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="hbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-bad"/>
    </marker>
    <marker id="hok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-ok"/>
    </marker>
  </defs>

  <rect class="alt" x="230" y="262" width="520" height="72" rx="6"/>
  <path class="sep" d="M230 282 L276 282 L284 274 L284 262"/>
  <path class="life" d="M100 66 L100 520"/>
  <path class="life" d="M320 66 L320 520"/>
  <path class="life" d="M660 66 L660 520"/>
  <path class="life" d="M920 66 L920 520"/>
  <rect class="store" x="20.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="100" y="48" text-anchor="middle">S3</text>
  <rect class="box" x="240.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="320" y="48" text-anchor="middle">Request 1</text>
  <rect class="store" x="580.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="660" y="48" text-anchor="middle">Postgres</text>
  <rect class="box" x="840.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="920" y="39" text-anchor="middle">Request 2</text>
  <text class="note muted" x="920" y="55" text-anchor="middle">same key</text>
  <path class="arrow" d="M320 110 L658 110" marker-end="url(#h)"/>
  <text class="note muted" x="490.0" y="104" text-anchor="middle">reserve, insert key with hash, no job, commit</text>
  <path class="arrow" d="M920 150 L662 150" marker-end="url(#h)"/>
  <text class="note muted" x="790.0" y="144" text-anchor="middle">reserve, conflict, select for update</text>
  <path class="arrow dash" d="M660 190 L918 190" marker-end="url(#h)"/>
  <text class="note muted" x="790.0" y="184" text-anchor="middle">same hash, no job, heartbeat fresh</text>
  <path class="bad dash" d="M920 214 L884 214 L884 236 L918 236" marker-end="url(#hbad)"/>
  <text class="note tbad" x="876" y="229.0" text-anchor="end">InProgress, 409 with Retry-After 2</text>
  <text class="tag fg" x="238" y="276">loop</text>
  <text class="note fg" x="292" y="276">[while request 1 uploads]</text>
  <path class="arrow" d="M320 314 L658 314" marker-end="url(#h)"/>
  <text class="note muted" x="490.0" y="308" text-anchor="middle">heartbeat_at = now()</text>
  <path class="arrow" d="M320 376 L102 376" marker-end="url(#h)"/>
  <text class="note muted" x="210.0" y="370" text-anchor="middle">put inputs under jobs/id</text>
  <path class="arrow" d="M320 416 L658 416" marker-end="url(#h)"/>
  <text class="note muted" x="490.0" y="410" text-anchor="middle">one transaction: job, attempt, attach job to key</text>
  <path class="arrow" d="M920 456 L662 456" marker-end="url(#h)"/>
  <text class="note muted" x="790.0" y="450" text-anchor="middle">retry with the same key</text>
  <path class="ok dash" d="M660 496 L918 496" marker-end="url(#hok)"/>
  <text class="note tok" x="790.0" y="490" text-anchor="middle">Replay of the job</text>
  <text class="note muted" x="20" y="548">solid: request · dashed: answer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
