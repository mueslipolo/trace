<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 376" role="img" aria-label="Components and data flow: a client application calls the api process (FastAPI app and Router) over HTTPS REST with an API key. The API creates jobs and attempts in Postgres and LISTENs there for Prefer wait, and puts inputs into and streams outputs from the S3 bucket. Worker processes, one set per backend, claim, lease, report outcomes and sweep in Postgres, get inputs from and put outputs to S3, and call their adapter, which drives the engine. The purge retention pass uses Postgres and S3; the read-only console queries Postgres." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.engine { fill: #f7f7f7; }
    .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.4; }
    .frame { fill: #eef7f1; stroke: #7fb38f; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .dash { stroke-dasharray: 4 3; }
    .bad { stroke: #c62a2f; } .badt { fill: #c62a2f; } .ok { stroke: #1a7f37; } .okt { fill: #1a7f37; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name { font-size: 13px; font-weight: 600; } .note { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.engine { fill: #23262d; }
      .store { fill: #33290f; stroke: #e5b94e; }
      .frame { fill: #15241b; stroke: #4f8a62; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .bad { stroke: #ff7b7b; } .badt { fill: #ff7b7b; } .ok { stroke: #5cc97a; } .okt { fill: #5cc97a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="badt"/>
    </marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="okt"/>
    </marker>
  </defs>

  <!-- client -->
  <rect class="box" x="16" y="194" width="110" height="52" rx="8"/>
  <text class="name fg" x="71" y="216" text-anchor="middle">Client</text>
  <text class="name fg" x="71" y="232" text-anchor="middle">application</text>
  <text class="note muted" x="168" y="198" text-anchor="middle">HTTPS REST,</text>
  <text class="note muted" x="168" y="211" text-anchor="middle">API key</text>

  <!-- api process -->
  <rect class="frame" x="210" y="160" width="150" height="102" rx="10"/>
  <text class="note muted" x="352" y="177" text-anchor="end">api process</text>
  <rect class="box" x="226" y="194" width="118" height="52" rx="6"/>
  <text class="name fg" x="285" y="216" text-anchor="middle">FastAPI app</text>
  <text class="name fg" x="285" y="232" text-anchor="middle">and Router</text>
  <path class="arrow" d="M126 220 L224 220" marker-end="url(#h)"/>

  <!-- stores, purge, console -->
  <rect class="box" x="540" y="16" width="150" height="44" rx="6"/>
  <text class="name fg" x="615" y="34" text-anchor="middle">console</text>
  <text class="note muted" x="615" y="49" text-anchor="middle">read-only operator view</text>

  <rect class="store" x="540" y="100" width="150" height="56" rx="8"/>
  <text class="name fg" x="615" y="133" text-anchor="middle">Postgres</text>

  <rect class="box" x="540" y="196" width="150" height="44" rx="6"/>
  <text class="name fg" x="615" y="214" text-anchor="middle">purge</text>
  <text class="note muted" x="615" y="229" text-anchor="middle">retention pass</text>

  <rect class="store" x="540" y="280" width="150" height="56" rx="8"/>
  <text class="name fg" x="615" y="304" text-anchor="middle">S3 bucket</text>
  <text class="note muted" x="615" y="320" text-anchor="middle">files/ and jobs/</text>

  <path class="arrow" d="M615 60 L615 98" marker-end="url(#h)"/>
  <text class="note muted" x="623" y="83">read-only queries</text>
  <path class="arrow" d="M615 196 L615 158" marker-end="url(#h)"/>
  <path class="arrow" d="M615 240 L615 278" marker-end="url(#h)"/>

  <!-- api to stores -->
  <path class="arrow" d="M250 194 L250 128 L538 128" marker-end="url(#h)"/>
  <text class="note muted" x="395" y="106" text-anchor="middle">create job and attempt;</text>
  <text class="note muted" x="395" y="119" text-anchor="middle">LISTEN for Prefer wait</text>
  <path class="arrow" d="M250 246 L250 308 L538 308" marker-end="url(#h)"/>
  <text class="note muted" x="395" y="326" text-anchor="middle">put inputs, stream outputs</text>

  <!-- worker processes -->
  <rect class="frame" x="780" y="160" width="244" height="130" rx="10"/>
  <text class="note muted" x="1016" y="177" text-anchor="end">worker processes, per backend</text>
  <rect class="box" x="796" y="190" width="110" height="60" rx="6"/>
  <text class="name fg" x="851" y="215" text-anchor="middle">Worker loop</text>
  <text class="note muted" x="851" y="231" text-anchor="middle">keep-alive, sweep</text>
  <rect class="box" x="930" y="200" width="80" height="40" rx="6"/>
  <text class="name fg" x="970" y="225" text-anchor="middle">Adapter</text>
  <path class="arrow" d="M906 220 L928 220" marker-end="url(#h)"/>

  <rect class="box engine" x="930" y="320" width="80" height="40" rx="6"/>
  <text class="name fg" x="970" y="345" text-anchor="middle">Engine</text>
  <path class="arrow" d="M970 240 L970 318" marker-end="url(#h)"/>

  <!-- workers to stores -->
  <path class="arrow" d="M820 190 L820 128 L692 128" marker-end="url(#h)"/>
  <text class="note muted" x="756" y="106" text-anchor="middle">claim, lease,</text>
  <text class="note muted" x="756" y="119" text-anchor="middle">outcome, sweep</text>
  <path class="arrow" d="M820 250 L820 308 L692 308" marker-end="url(#h)"/>
  <text class="note muted" x="758" y="326" text-anchor="middle">get inputs, put outputs</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
