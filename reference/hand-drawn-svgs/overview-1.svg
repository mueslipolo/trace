<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 392" role="img" aria-label="The engine abstraction: a client asks for an operation (convert) with formats and options; the Router picks a backend from grants, route preference lists, live workers and breaker state. Each backend has its adapter, which reaches its engine: gotenberg over HTTP on the converter network to Gotenberg with LibreOffice, pandoc and jubarte as a child process via the runner, the fakes in-process with no engine. OCR, Tika and PDF tools backends are planned and their adapters not written." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.engine { fill: #f7f7f7; }
    .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.4; }
    .frame { fill: #eef7f1; stroke: #7fb38f; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .dash { stroke-dasharray: 4 3; }
    .bad { stroke: #c62a2f; } .badt { fill: #c62a2f; } .ok { stroke: #1a7f37; } .okt { fill: #1a7f37; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name { font-size: 13px; font-weight: 600; } .note { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.engine { fill: #23262d; }
      .store { fill: #33290f; stroke: #e5b94e; }
      .frame { fill: #15241b; stroke: #4f8a62; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .bad { stroke: #ff7b7b; } .badt { fill: #ff7b7b; } .ok { stroke: #5cc97a; } .okt { fill: #5cc97a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="badt"/>
    </marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="okt"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text class="note muted" x="575" y="36" text-anchor="middle">backends</text>
  <text class="note muted" x="719" y="36" text-anchor="middle">adapters</text>
  <text class="note muted" x="968" y="36" text-anchor="middle">engines</text>

  <!-- client, operation -->
  <rect class="box" x="16" y="174" width="80" height="46" rx="8"/>
  <text class="name fg" x="56" y="202" text-anchor="middle">Client</text>
  <path class="arrow" d="M96 197 L204 197" marker-end="url(#h)"/>
  <text class="note muted" x="151" y="176" text-anchor="middle">operation,</text>
  <text class="note muted" x="151" y="189" text-anchor="middle">formats, options</text>

  <rect class="box" x="206" y="174" width="90" height="46" rx="8"/>
  <text class="name fg" x="251" y="194" text-anchor="middle">Operation</text>
  <text class="note muted" x="251" y="209" text-anchor="middle">convert</text>
  <path class="arrow" d="M296 197 L328 197" marker-end="url(#h)"/>

  <!-- router -->
  <rect class="box" x="330" y="50" width="150" height="294" rx="8"/>
  <text class="name fg" x="405" y="160" text-anchor="middle">Router</text>
  <text class="note muted" x="405" y="184" text-anchor="middle">grants</text>
  <text class="note muted" x="405" y="200" text-anchor="middle">route preference lists</text>
  <text class="note muted" x="405" y="216" text-anchor="middle">live workers</text>
  <text class="note muted" x="405" y="232" text-anchor="middle">breaker state</text>

  <!-- router to backends -->
  <path class="arrow" d="M480 73 L508 73" marker-end="url(#h)"/>
  <path class="arrow" d="M480 135 L508 135" marker-end="url(#h)"/>
  <path class="arrow" d="M480 197 L508 197" marker-end="url(#h)"/>
  <path class="arrow dash" d="M480 259 L508 259" marker-end="url(#h)"/>
  <path class="arrow" d="M480 321 L508 321" marker-end="url(#h)"/>

  <!-- backends -->
  <rect class="box" x="510" y="50" width="130" height="46" rx="6"/>
  <text class="name fg" x="575" y="78" text-anchor="middle">gotenberg</text>
  <rect class="box" x="510" y="112" width="130" height="46" rx="6"/>
  <text class="name fg" x="575" y="140" text-anchor="middle">pandoc</text>
  <rect class="box" x="510" y="174" width="130" height="46" rx="6"/>
  <text class="name fg" x="575" y="194" text-anchor="middle">jubarte</text>
  <text class="note muted" x="575" y="209" text-anchor="middle">testing</text>
  <rect class="box dash" x="510" y="236" width="130" height="46" rx="6"/>
  <text class="name fg" x="575" y="252" text-anchor="middle">OCR, Tika,</text>
  <text class="name fg" x="575" y="265" text-anchor="middle">PDF tools</text>
  <text class="note muted" x="575" y="278" text-anchor="middle">planned</text>
  <rect class="box" x="510" y="298" width="130" height="46" rx="6"/>
  <text class="name fg" x="575" y="318" text-anchor="middle">fake-*</text>
  <text class="note muted" x="575" y="333" text-anchor="middle">testing</text>

  <!-- backends to adapters -->
  <path class="arrow" d="M640 73 L662 73" marker-end="url(#h)"/>
  <path class="arrow" d="M640 135 L662 135" marker-end="url(#h)"/>
  <path class="arrow" d="M640 197 L662 197" marker-end="url(#h)"/>
  <path class="arrow dash" d="M640 259 L662 259" marker-end="url(#h)"/>
  <path class="arrow" d="M640 321 L662 321" marker-end="url(#h)"/>

  <!-- adapters -->
  <rect class="box" x="664" y="50" width="110" height="46" rx="6"/>
  <text class="name fg" x="719" y="78" text-anchor="middle">gotenberg</text>
  <rect class="box" x="664" y="112" width="110" height="46" rx="6"/>
  <text class="name fg" x="719" y="140" text-anchor="middle">pandoc</text>
  <rect class="box" x="664" y="174" width="110" height="46" rx="6"/>
  <text class="name fg" x="719" y="202" text-anchor="middle">jubarte</text>
  <rect class="box dash" x="664" y="236" width="110" height="46" rx="6"/>
  <text class="name muted" x="719" y="264" text-anchor="middle">not written</text>
  <rect class="box" x="664" y="298" width="110" height="46" rx="6"/>
  <text class="name fg" x="719" y="326" text-anchor="middle">fake</text>

  <!-- adapters to engines -->
  <path class="arrow" d="M774 73 L904 73" marker-end="url(#h)"/>
  <text class="note muted" x="839" y="52" text-anchor="middle">HTTP,</text>
  <text class="note muted" x="839" y="65" text-anchor="middle">converter network</text>
  <path class="arrow" d="M774 135 L904 135" marker-end="url(#h)"/>
  <text class="note muted" x="839" y="114" text-anchor="middle">child process</text>
  <text class="note muted" x="839" y="127" text-anchor="middle">via runner</text>
  <path class="arrow" d="M774 197 L904 197" marker-end="url(#h)"/>
  <text class="note muted" x="839" y="176" text-anchor="middle">child process</text>
  <text class="note muted" x="839" y="189" text-anchor="middle">via runner</text>
  <path class="arrow" d="M774 321 L904 321" marker-end="url(#h)"/>
  <text class="note muted" x="839" y="313" text-anchor="middle">in-process</text>

  <!-- engines -->
  <rect class="box engine" x="906" y="50" width="124" height="46" rx="6"/>
  <text class="name fg" x="968" y="70" text-anchor="middle">Gotenberg</text>
  <text class="note muted" x="968" y="85" text-anchor="middle">with LibreOffice</text>
  <rect class="box engine" x="906" y="112" width="124" height="46" rx="6"/>
  <text class="name fg" x="968" y="140" text-anchor="middle">Pandoc</text>
  <rect class="box engine" x="906" y="174" width="124" height="46" rx="6"/>
  <text class="name fg" x="968" y="202" text-anchor="middle">Jubarte</text>
  <rect class="box engine" x="906" y="298" width="124" height="46" rx="6"/>
  <text class="name muted" x="968" y="326" text-anchor="middle">no engine</text>

  <!-- legend -->
  <path class="arrow" d="M330 374 L362 374"/>
  <text class="note muted" x="370" y="378">built</text>
  <path class="arrow dash" d="M420 374 L452 374"/>
  <text class="note muted" x="460" y="378">planned</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
