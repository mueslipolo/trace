<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="The network fence in the compose stack: API clients reach the API over HTTP 8000 with a bearer key, operators reach its management ports without authentication. The API, console, fake-ok and the one-shots sit on the default network, which routes out; Postgres and the s3 forwarder are on default and workers; the s3 forwarder is also on the internal store network, where the S3 gateway checks the keys in front of the data server. The engine workers are on the internal workers network; only worker-gotenberg also reaches Gotenberg on the internal converter network." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .zone-default { fill: #eef2f8; stroke: #8aa0c2; } .zone-workers { fill: #eef7f1; stroke: #7fb38f; }
    .zone-converter { fill: #fbf1e6; stroke: #d0a06a; } .zone-store { fill: #f3effb; stroke: #a78fd6; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.bridge, .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.6; }
    .box.obs, .dashed { stroke-dasharray: 4 3; } .box.engine { fill: #f7f7f7; }
    .box.ok { stroke: #1a7f37; stroke-width: 1.6; } .box.bad { stroke: #c62a2f; stroke-width: 1.6; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .arrow.ok { stroke: #1a7f37; } .head-ok { fill: #1a7f37; } .arrow.bad { stroke: #c62a2f; } .head-bad { fill: #c62a2f; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zt { font-size: 12px; font-weight: 700; letter-spacing: .04em; } .name { font-size: 12.5px; font-weight: 600; }
    .note { font-size: 11px; }
    .frame { fill: #eef7f1; stroke: #7fb38f; } .step { fill: #ffffff; stroke: #8b93a3; } .step.filter { fill: #e8e4fb; stroke: #7a4fd6; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .zone-default { fill: #18202d; stroke: #4f6a94; } .zone-workers { fill: #15241b; stroke: #4f8a62; }
      .zone-converter { fill: #2a1f14; stroke: #a3743d; } .zone-store { fill: #211a33; stroke: #7d62b8; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.bridge, .store { fill: #33290f; stroke: #e5b94e; }
      .box.engine { fill: #23262d; } .box.ok { stroke: #5cc97a; } .box.bad { stroke: #ff7b7b; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .arrow.ok { stroke: #5cc97a; } .head-ok { fill: #5cc97a; } .arrow.bad { stroke: #ff7b7b; } .head-bad { fill: #ff7b7b; }
      .frame { fill: #15241b; stroke: #4f8a62; } .step { fill: #1b1e25; stroke: #6b7385; } .step.filter { fill: #261d45; stroke: #b195ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-ok"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-bad"/>
    </marker>
  </defs>
  <rect class="zone-default" x="20" y="44" width="920" height="176" rx="10"/>
  <text class="zt fg" x="926" y="64" text-anchor="end">DEFAULT · routes out</text>
  <rect class="zone-workers" x="20" y="262" width="600" height="218" rx="10"/>
  <text class="zt fg" x="606" y="474" text-anchor="end">WORKERS · internal</text>
  <rect class="zone-store" x="660" y="262" width="280" height="218" rx="10"/>
  <text class="zt fg" x="926" y="474" text-anchor="end">STORE · internal</text>
  <rect class="zone-converter" x="20" y="520" width="600" height="84" rx="10"/>
  <text class="zt fg" x="606" y="540" text-anchor="end">CONVERTER · internal</text>
  <text class="name fg" x="110" y="18" text-anchor="middle">API client</text>
  <path class="arrow" d="M110 26 L110 84" marker-end="url(#a)"/>
  <text class="note muted" x="118" y="40" text-anchor="start">HTTP 8000 · Bearer key</text>
  <text class="name fg" x="300" y="18" text-anchor="middle">operator</text>
  <path class="arrow dashed" d="M300 26 L300 84" marker-end="url(#a)"/>
  <text class="note muted" x="308" y="40" text-anchor="start">management ports · no auth</text>
  <rect class="box" x="60" y="84" width="300" height="50" rx="6"/>
  <text class="name fg" x="210.0" y="106" text-anchor="middle">api · console · fake-ok</text>
  <text class="note muted" x="210.0" y="120" text-anchor="middle">purge · migrate · s3-init</text>
  <rect class="box bridge" x="100" y="196" width="130" height="90" rx="6"/>
  <text class="name fg" x="165.0" y="245" text-anchor="middle">postgres</text>
  <rect class="box bridge" x="584" y="196" width="116" height="100" rx="6"/>
  <text class="name fg" x="642.0" y="236" text-anchor="middle">s3</text>
  <text class="note muted" x="642.0" y="250" text-anchor="middle">forwarder</text>
  <text class="note muted" x="642.0" y="264" text-anchor="middle">TCP 8333 only</text>
  <text class="note muted" x="250" y="200" text-anchor="start">postgres and s3 are on both networks</text>
  <path class="arrow" d="M165 134 L165 196" marker-end="url(#a)"/>
  <path class="arrow" d="M360 109 C 500 109, 630 120, 642 196" marker-end="url(#a)"/>
  <text class="note muted" x="470" y="152" text-anchor="middle">signed · the console holds no S3 keys</text>
  <rect class="box" x="60" y="336" width="300" height="50" rx="6"/>
  <text class="name fg" x="210.0" y="358" text-anchor="middle">engine workers</text>
  <text class="note muted" x="210.0" y="372" text-anchor="middle">local engines inside: no socket</text>
  <path class="arrow" d="M165 336 L165 286" marker-end="url(#a)"/>
  <path class="arrow" d="M360 352 L584 270" marker-end="url(#a)"/>
  <rect class="box" x="760" y="304" width="160" height="44" rx="6"/>
  <text class="name fg" x="840.0" y="323" text-anchor="middle">s3-gateway</text>
  <text class="note muted" x="840.0" y="337" text-anchor="middle">S3 API · checks the keys</text>
  <rect class="box" x="760" y="386" width="160" height="58" rx="6"/>
  <text class="name fg" x="840.0" y="405" text-anchor="middle">s3-store</text>
  <text class="note muted" x="840.0" y="419" text-anchor="middle">filer · master · volume</text>
  <text class="note muted" x="840.0" y="433" text-anchor="middle">no key check</text>
  <path class="arrow" d="M700 280 L760 316" marker-end="url(#a)"/>
  <text class="note muted" x="664" y="322" text-anchor="start">also on store</text>
  <path class="arrow" d="M840 348 L840 386" marker-end="url(#a)"/>
  <rect class="box engine" x="60" y="548" width="160" height="40" rx="6"/>
  <text class="name fg" x="140.0" y="565" text-anchor="middle">gotenberg</text>
  <text class="note muted" x="140.0" y="579" text-anchor="middle">:3000</text>
  <path class="arrow" d="M110 386 L110 548" marker-end="url(#a)"/>
  <text class="note muted" x="120" y="504" text-anchor="start">only worker-gotenberg is on converter</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
