<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="Double execution after a lost lease: worker A claims attempt 1 and its keep-alive stalls; a sweep fails attempt 1 as lease lost and queues attempt 2, which worker B claims. Worker A's renewal then returns false: if its run had already ended it uploads to out/1, complete_attempt refuses it and it deletes out/1; if the loss was already seen it drops the outcome. Worker B completes attempt 2 and the job succeeds." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .box { fill: #ffffff; stroke: #1d2330; } .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.4; }
    .frame { fill: #eef7f1; stroke: #7fb38f; } .step { fill: #ffffff; stroke: #8b93a3; } .step.filter { fill: #e8e4fb; stroke: #7a4fd6; }
    .alt { fill: #f6f7f9; stroke: #8b93a3; } .thead { fill: #eef2f8; stroke: #1d2330; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; } .dash { stroke-dasharray: 5 4; }
    .life { stroke: #8b93a3; stroke-dasharray: 4 4; fill: none; } .sep { stroke: #8b93a3; stroke-dasharray: 4 3; fill: none; }
    .bad { stroke: #c62a2f; fill: none; } .head-bad { fill: #c62a2f; } .tbad { fill: #c62a2f; }
    .ok { stroke: #1a7f37; fill: none; } .head-ok { fill: #1a7f37; } .tok { fill: #1a7f37; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name { font-size: 13px; font-weight: 600; } .note { font-size: 11px; } .tag { font-size: 11px; font-weight: 700; }
    .col { font-size: 11.5px; } .key { font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .store { fill: #33290f; stroke: #e5b94e; }
      .frame { fill: #15241b; stroke: #4f8a62; } .step { fill: #1b1e25; stroke: #6b7385; } .step.filter { fill: #261d45; stroke: #b195ff; }
      .alt { fill: #20232b; stroke: #6b7385; } .thead { fill: #18202d; stroke: #c9ced8; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .life { stroke: #6b7385; } .sep { stroke: #6b7385; }
      .bad { stroke: #ff7b7b; } .head-bad { fill: #ff7b7b; } .tbad { fill: #ff7b7b; }
      .ok { stroke: #5cc97a; } .head-ok { fill: #5cc97a; } .tok { fill: #5cc97a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="hbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-bad"/>
    </marker>
    <marker id="hok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-ok"/>
    </marker>
  </defs>

  <rect class="alt" x="30" y="342" width="450" height="160" rx="6"/>
  <path class="sep" d="M30 362 L70 362 L78 354 L78 342"/>
  <path class="sep" d="M30 440 L480 440"/>
  <path class="life" d="M130 66 L130 566"/>
  <path class="life" d="M400 66 L400 566"/>
  <path class="life" d="M690 66 L690 566"/>
  <path class="life" d="M900 66 L900 566"/>
  <rect class="box" x="50.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="130" y="39" text-anchor="middle">Worker A</text>
  <text class="note muted" x="130" y="55" text-anchor="middle">slow</text>
  <rect class="store" x="320.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="400" y="48" text-anchor="middle">Postgres</text>
  <rect class="box" x="610.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="690" y="39" text-anchor="middle">Sweep</text>
  <text class="note muted" x="690" y="55" text-anchor="middle">any worker</text>
  <rect class="box" x="820.0" y="20" width="160" height="46" rx="8"/>
  <text class="name fg" x="900" y="48" text-anchor="middle">Worker B</text>
  <path class="arrow" d="M130 110 L398 110" marker-end="url(#h)"/>
  <text class="note muted" x="265.0" y="104" text-anchor="middle">claim, attempt 1 running, lease set</text>
  <rect class="step" x="30.0" y="132" width="200" height="24" rx="4"/>
  <text class="note fg" x="130" y="148" text-anchor="middle">keep-alive stalls, lease passes</text>
  <path class="arrow" d="M690 200 L402 200" marker-end="url(#h)"/>
  <text class="note muted" x="545.0" y="194" text-anchor="middle">lock job then attempt 1, lease still expired</text>
  <path class="arrow" d="M690 240 L402 240" marker-end="url(#h)"/>
  <text class="note muted" x="545.0" y="234" text-anchor="middle">attempt 1 failed (lease lost), attempt 2 queued</text>
  <path class="arrow" d="M900 280 L402 280" marker-end="url(#h)"/>
  <text class="note muted" x="545" y="274" text-anchor="middle">claim attempt 2</text>
  <path class="arrow" d="M130 320 L398 320" marker-end="url(#h)"/>
  <text class="note muted" x="265.0" y="314" text-anchor="middle">renew_lease returns false, lost flag set</text>
  <text class="tag fg" x="38" y="356">alt</text>
  <text class="note fg" x="86" y="356">[run ended before the loss was seen]</text>
  <path class="bad" d="M130 388 L398 388" marker-end="url(#hbad)"/>
  <text class="note tbad" x="265.0" y="382" text-anchor="middle">upload to out/1, complete_attempt refused</text>
  <path class="arrow" d="M130 424 L398 424" marker-end="url(#h)"/>
  <text class="note muted" x="265.0" y="418" text-anchor="middle">delete out/1 (orphan if this fails)</text>
  <text class="tag fg" x="38" y="454">else</text>
  <text class="note fg" x="78" y="454">[lost already set]</text>
  <path class="arrow" d="M130 468 L166 468 L166 490 L132 490" marker-end="url(#h)"/>
  <text class="note muted" x="174" y="483.0">drop outcome, no upload</text>
  <path class="ok" d="M900 540 L402 540" marker-end="url(#hok)"/>
  <text class="note tok" x="545" y="534" text-anchor="middle">complete_attempt for attempt 2, job succeeded</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
