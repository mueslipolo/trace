<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 356" role="img" aria-label="The vocabulary of Habeas Doc: a client creates jobs and uploads files. A job reads its inputs from files, can read the outputs of an earlier job, and runs as attempts. An attempt is claimed by a worker, which serves one backend and calls the adapter the backend uses. The adapter drives the engine and declares capabilities, which decide which backends are candidates for a job." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.engine { fill: #f7f7f7; }
    .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.4; }
    .frame { fill: #eef7f1; stroke: #7fb38f; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .dash { stroke-dasharray: 4 3; }
    .bad { stroke: #c62a2f; } .badt { fill: #c62a2f; } .ok { stroke: #1a7f37; } .okt { fill: #1a7f37; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .name { font-size: 13px; font-weight: 600; } .note { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.engine { fill: #23262d; }
      .store { fill: #33290f; stroke: #e5b94e; }
      .frame { fill: #15241b; stroke: #4f8a62; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .bad { stroke: #ff7b7b; } .badt { fill: #ff7b7b; } .ok { stroke: #5cc97a; } .okt { fill: #5cc97a; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="badt"/>
    </marker>
    <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="okt"/>
    </marker>
  </defs>

  <!-- row 0 -->
  <rect class="box" x="202" y="30" width="100" height="50" rx="8"/>
  <text class="name fg" x="252" y="60" text-anchor="middle">File</text>
  <rect class="box" x="748" y="30" width="100" height="50" rx="8"/>
  <text class="name fg" x="798" y="60" text-anchor="middle">Capabilities</text>

  <!-- row 1 -->
  <rect class="box" x="20" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="70" y="190" text-anchor="middle">Client</text>
  <rect class="box" x="202" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="252" y="190" text-anchor="middle">Job</text>
  <rect class="box" x="384" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="434" y="190" text-anchor="middle">Attempt</text>
  <rect class="box" x="566" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="616" y="190" text-anchor="middle">Worker</text>
  <rect class="box" x="748" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="798" y="190" text-anchor="middle">Adapter</text>
  <rect class="box engine" x="930" y="160" width="100" height="50" rx="8"/>
  <text class="name fg" x="980" y="190" text-anchor="middle">Engine</text>

  <!-- row 2 -->
  <rect class="box" x="202" y="290" width="100" height="50" rx="8"/>
  <text class="name fg" x="252" y="320" text-anchor="middle">Earlier job</text>
  <rect class="box" x="748" y="290" width="100" height="50" rx="8"/>
  <text class="name fg" x="798" y="320" text-anchor="middle">Backend</text>

  <!-- client -->
  <path class="arrow" d="M120 185 L200 185" marker-end="url(#h)"/>
  <text class="note muted" x="160" y="177" text-anchor="middle">creates</text>
  <path class="arrow" d="M70 160 L70 55 L200 55" marker-end="url(#h)"/>
  <text class="note muted" x="135" y="47" text-anchor="middle">uploads</text>

  <!-- job -->
  <path class="arrow" d="M252 160 L252 82" marker-end="url(#h)"/>
  <text class="note muted" x="244" y="124" text-anchor="end">reads inputs from</text>
  <path class="arrow" d="M252 210 L252 288" marker-end="url(#h)"/>
  <text class="note muted" x="244" y="254" text-anchor="end">can read outputs of</text>
  <path class="arrow" d="M302 195 L382 195" marker-end="url(#h)"/>
  <text class="note muted" x="343" y="211" text-anchor="middle">runs as</text>

  <!-- attempt, worker -->
  <path class="arrow" d="M484 185 L564 185" marker-end="url(#h)"/>
  <text class="note muted" x="525" y="177" text-anchor="middle">is claimed by</text>
  <path class="arrow" d="M666 185 L746 185" marker-end="url(#h)"/>
  <text class="note muted" x="707" y="177" text-anchor="middle">calls</text>
  <path class="arrow" d="M616 210 L616 315 L746 315" marker-end="url(#h)"/>
  <text class="note muted" x="681" y="307" text-anchor="middle">serves one</text>

  <!-- backend, adapter -->
  <path class="arrow" d="M798 290 L798 212" marker-end="url(#h)"/>
  <text class="note muted" x="806" y="254">uses</text>
  <path class="arrow" d="M798 160 L798 82" marker-end="url(#h)"/>
  <text class="note muted" x="806" y="124">declares</text>
  <path class="arrow" d="M848 185 L928 185" marker-end="url(#h)"/>
  <text class="note muted" x="889" y="177" text-anchor="middle">drives</text>

  <!-- capabilities back to the job -->
  <path class="arrow" d="M748 55 L343 55 L343 172 L304 172" marker-end="url(#h)"/>
  <text class="note muted" x="545" y="47" text-anchor="middle">decide which backends are candidates for</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
