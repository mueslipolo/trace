<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Who may change audit_event: a statement made as habeas_app (api, worker, console) may only SELECT and INSERT, and UPDATE, DELETE, TRUNCATE and DDL are refused by privilege; as habeas_purge (habeas purge) it may also DELETE, and the row trigger deletes any row when habeas.audit_purge is on in this transaction and otherwise raises that audit_event is append-only; the owner or a superuser is outside the guarantee and can drop, disable or skip the triggers." xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .fg { fill: #1d2330; } .muted { fill: #5d6677; }
    .zone-default { fill: #eef2f8; stroke: #8aa0c2; } .zone-workers { fill: #eef7f1; stroke: #7fb38f; }
    .zone-converter { fill: #fbf1e6; stroke: #d0a06a; } .zone-store { fill: #f3effb; stroke: #a78fd6; }
    .box { fill: #ffffff; stroke: #1d2330; } .box.bridge, .store { fill: #fff8db; stroke: #9a6700; stroke-width: 1.6; }
    .box.obs, .dashed { stroke-dasharray: 4 3; } .box.engine { fill: #f7f7f7; }
    .box.ok { stroke: #1a7f37; stroke-width: 1.6; } .box.bad { stroke: #c62a2f; stroke-width: 1.6; }
    .arrow { stroke: #1d2330; fill: none; } .head { fill: #1d2330; }
    .arrow.ok { stroke: #1a7f37; } .head-ok { fill: #1a7f37; } .arrow.bad { stroke: #c62a2f; } .head-bad { fill: #c62a2f; }
    text { font: 12px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .zt { font-size: 12px; font-weight: 700; letter-spacing: .04em; } .name { font-size: 12.5px; font-weight: 600; }
    .note { font-size: 11px; }
    .frame { fill: #eef7f1; stroke: #7fb38f; } .step { fill: #ffffff; stroke: #8b93a3; } .step.filter { fill: #e8e4fb; stroke: #7a4fd6; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e3e6ec; } .muted { fill: #9aa3b2; }
      .zone-default { fill: #18202d; stroke: #4f6a94; } .zone-workers { fill: #15241b; stroke: #4f8a62; }
      .zone-converter { fill: #2a1f14; stroke: #a3743d; } .zone-store { fill: #211a33; stroke: #7d62b8; }
      .box { fill: #1b1e25; stroke: #c9ced8; } .box.bridge, .store { fill: #33290f; stroke: #e5b94e; }
      .box.engine { fill: #23262d; } .box.ok { stroke: #5cc97a; } .box.bad { stroke: #ff7b7b; }
      .arrow { stroke: #c9ced8; } .head { fill: #c9ced8; }
      .arrow.ok { stroke: #5cc97a; } .head-ok { fill: #5cc97a; } .arrow.bad { stroke: #ff7b7b; } .head-bad { fill: #ff7b7b; }
      .frame { fill: #15241b; stroke: #4f8a62; } .step { fill: #1b1e25; stroke: #6b7385; } .step.filter { fill: #261d45; stroke: #b195ff; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head"/>
    </marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-ok"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" class="head-bad"/>
    </marker>
  </defs>
  <rect class="box" x="380" y="20" width="200" height="36" rx="6"/>
  <text class="name fg" x="480.0" y="42" text-anchor="middle">statement on audit_event</text>
  <path class="arrow" d="M480 56 L480 86" marker-end="url(#a)"/>
  <rect class="box" x="400" y="86" width="160" height="36" rx="18.0"/>
  <text class="name fg" x="480.0" y="108" text-anchor="middle">connected as?</text>
  <path class="arrow" d="M400 104 L165 104 L165 200" marker-end="url(#a)"/>
  <text class="name fg" x="175" y="150" text-anchor="start">habeas_app</text>
  <text class="note muted" x="175" y="165" text-anchor="start">api, worker, console</text>
  <path class="arrow" d="M480 122 L480 200" marker-end="url(#a)"/>
  <text class="name fg" x="490" y="150" text-anchor="start">habeas_purge</text>
  <text class="note muted" x="490" y="165" text-anchor="start">habeas purge</text>
  <path class="arrow" d="M560 104 L805 104 L805 200" marker-end="url(#a)"/>
  <text class="name fg" x="795" y="150" text-anchor="end">owner or superuser</text>
  <rect class="box" x="40" y="200" width="250" height="62" rx="6"/>
  <text class="name fg" x="165.0" y="221" text-anchor="middle">SELECT and INSERT only</text>
  <text class="note muted" x="165.0" y="235" text-anchor="middle">UPDATE, DELETE, TRUNCATE, DDL</text>
  <text class="note muted" x="165.0" y="249" text-anchor="middle">refused by privilege</text>
  <rect class="box" x="365" y="200" width="230" height="36" rx="6"/>
  <text class="name fg" x="480.0" y="222" text-anchor="middle">SELECT, INSERT and DELETE</text>
  <rect class="box obs" x="680" y="200" width="250" height="62" rx="6"/>
  <text class="name fg" x="805.0" y="221" text-anchor="middle">outside the guarantee</text>
  <text class="note muted" x="805.0" y="235" text-anchor="middle">can drop or disable the triggers</text>
  <text class="note muted" x="805.0" y="249" text-anchor="middle">skip them with session_replication_role</text>
  <path class="arrow" d="M480 236 L480 276" marker-end="url(#a)"/>
  <rect class="box" x="320" y="276" width="320" height="58" rx="29.0"/>
  <text class="name fg" x="480.0" y="295" text-anchor="middle">row trigger</text>
  <text class="note muted" x="480.0" y="309" text-anchor="middle">DELETE and habeas.audit_purge = on</text>
  <text class="note muted" x="480.0" y="323" text-anchor="middle">in this transaction?</text>
  <path class="arrow ok" d="M400 334 L400 384" marker-end="url(#ok)"/>
  <text class="note muted" x="408" y="364" text-anchor="start">yes</text>
  <rect class="box ok" x="310" y="384" width="180" height="36" rx="6"/>
  <text class="name fg" x="400.0" y="406" text-anchor="middle">row deleted, any row</text>
  <path class="arrow bad" d="M580 334 L580 384" marker-end="url(#bad)"/>
  <text class="note muted" x="588" y="364" text-anchor="start">no</text>
  <rect class="box bad" x="510" y="384" width="250" height="36" rx="6"/>
  <text class="name fg" x="635.0" y="406" text-anchor="middle">RAISE: audit_event is append-only</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
